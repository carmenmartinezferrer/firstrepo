<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Questrial&display=swap" rel="stylesheet"><style>body{margin:0;background:#fff}#card{width:1000px;background:#fff;box-sizing:border-box;padding:40px 50px 30px;font-family:'Century Gothic', 'Questrial', 'Avenir', sans-serif;color:#222222}h1{font-family:'Playfair Display', Georgia, serif;font-weight:700;font-size:38px;margin:0 0 8px;line-height:1.1}.sub{font-size:22px;color:#6B6B6B;margin:0 0 34px} .src{font-size:20px;margin-top:34px}.row{display:flex;gap:28px} .sw{flex:1} .sq{height:200px;border-radius:2px}.nm{font-family:'Playfair Display', Georgia, serif;font-weight:700;font-size:28px;margin:16px 0 4px} .hx{font-size:19px;color:#6B6B6B;margin:0 0 8px} .dp{font-size:21px;line-height:1.3}.look{flex:1;position:relative} .look img{width:100%;height:440px;object-fit:cover;object-position:top;display:block}.chip{position:absolute;left:0;bottom:0;background:#D6447A;color:#fff;font-size:20px;letter-spacing:1px;text-transform:uppercase;padding:8px 14px}</style></head><body><div id="card"><h1>sensory riot: what's new on the runway</h1><p class="sub">the three SS27 shows named as early indicators of this mood</p><div class="row"><div class="look"><img src="images/runway-dries-van-noten.png"><div class="chip">Dries Van Noten</div></div><div class="look"><img src="images/runway-dolce-gabbana.png"><div class="chip">Dolce &amp; Gabbana</div></div><div class="look"><img src="images/runway-valentino.png"><div class="chip">Valentino</div></div></div></div></body></html>
