<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Questrial&display=swap" rel="stylesheet"><style>body{margin:0;background:#fff}#card{width:1000px;background:#fff;box-sizing:border-box;padding:40px 50px 30px;font-family:'Century Gothic', 'Questrial', 'Avenir', sans-serif;color:#222222}h1{font-family:'Playfair Display', Georgia, serif;font-weight:700;font-size:56px;margin:0 0 10px;line-height:1.1}.sub{font-size:25px;color:#6B6B6B;margin:0 0 36px} .src{font-size:20px;margin-top:34px}.row{display:flex;gap:28px} .sw{flex:1} .sq{height:200px;border-radius:2px}.nm{font-size:25px;margin:16px 0 4px} .hx{font-size:20px;color:#6B6B6B;margin:0 0 8px} .dp{font-size:20px;line-height:1.3}.look{flex:1;position:relative} .look img{width:100%;height:440px;object-fit:cover;object-position:top;display:block}.chip{position:absolute;left:0;bottom:0;background:#D6447A;color:#fff;font-size:20px;letter-spacing:1px;text-transform:uppercase;padding:8px 14px}</style></head><body><div id="card"><h1>heritage craft, on the SS27 runway</h1><p class="sub">the three shows the forecast names as early indicators for this aesthetic</p><div class="row"><div class="look"><img src="images/runway-chanel.png"><div class="chip">Chanel</div></div><div class="look"><img src="images/runway-ralph-lauren.png"><div class="chip">Ralph Lauren</div></div><div class="look"><img src="images/runway-acne-studios.png"><div class="chip">Acne Studios</div></div></div><div class="src">Images: runway photographs as reproduced in the Trendalytics FW27 forecast. Houses as named by Trendalytics.</div></div></body></html>
