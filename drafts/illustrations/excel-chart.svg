<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" role="img" aria-label="A spreadsheet turning into a bar chart">
  <title>From rows to a chart</title>
  <rect x="60" y="110" width="400" height="420" rx="14" fill="#FFFFFF" stroke="#222222" stroke-width="6"/>
  <rect x="60" y="110" width="400" height="70" rx="14" fill="#111111"/><rect x="60" y="150" width="400" height="30" fill="#111111"/>
  <g stroke="#DDDDDD" stroke-width="3"><line x1="160" y1="180" x2="160" y2="530"/><line x1="260" y1="180" x2="260" y2="530"/><line x1="360" y1="180" x2="360" y2="530"/><line x1="60" y1="250" x2="460" y2="250"/><line x1="60" y1="320" x2="460" y2="320"/><line x1="60" y1="390" x2="460" y2="390"/><line x1="60" y1="460" x2="460" y2="460"/></g>
  <g font-family="'Century Gothic', 'TeX Gyre Adventor', 'URW Gothic', Arial, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle"><text x="110" y="156">A</text><text x="210" y="156">B</text><text x="310" y="156">C</text><text x="410" y="156">D</text></g>
  <g fill="#D9D9D9"><rect x="80" y="205" width="60" height="16" rx="8"/><rect x="180" y="205" width="60" height="16" rx="8"/><rect x="280" y="275" width="60" height="16" rx="8"/><rect x="80" y="345" width="60" height="16" rx="8"/><rect x="380" y="345" width="60" height="16" rx="8"/><rect x="180" y="415" width="60" height="16" rx="8"/><rect x="280" y="485" width="60" height="16" rx="8"/></g>
  <line x1="490" y1="320" x2="548" y2="320" stroke="#D6447A" stroke-width="8" stroke-dasharray="12 9" stroke-linecap="round"/>
  <polygon points="544,304 572,320 544,336" fill="#D6447A"/>
  <path d="M610 130 L610 520 L950 520" fill="none" stroke="#222222" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="640" y="370" width="56" height="150" fill="#BDBDBD"/>
  <rect x="720" y="260" width="56" height="260" fill="#111111"/>
  <rect x="800" y="320" width="56" height="200" fill="#BDBDBD"/>
  <rect x="880" y="190" width="56" height="330" fill="#D6447A"/>
  <g font-family="'Century Gothic', 'TeX Gyre Adventor', 'URW Gothic', Arial, sans-serif" font-size="32" fill="#777777" text-anchor="middle"><text x="260" y="610">rows and columns</text><text x="780" y="610">a chart anyone can read</text></g>
</svg>
