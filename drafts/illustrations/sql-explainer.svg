<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" role="img" aria-label="How SQL works: you write a question on your laptop, it goes to the database in the cloud, and you get back only the rows you asked for">
  <title>What SQL does</title>

  <!-- Step 1: write the question -->
  <rect x="60" y="60" width="960" height="560" rx="40" fill="#F7F6F4"/>
  <circle cx="115" cy="122" r="30" fill="#D6447A"/>
  <text x="115" y="136" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="38" font-weight="700" fill="#FFFFFF">1</text>
  <text x="165" y="138" font-family="'DM Serif Display', Georgia, 'DejaVu Serif', serif" font-size="42" fill="#222222">You write a question in SQL</text>

  <rect x="210" y="190" width="660" height="330" rx="24" fill="#111111"/>
  <rect x="232" y="212" width="616" height="286" rx="10" fill="#1E1E1E"/>
  <g font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="34">
    <text x="262" y="275"><tspan fill="#D6447A" font-weight="700">SELECT</tspan><tspan fill="#FFFFFF"> brand, colour</tspan></text>
    <text x="262" y="325"><tspan fill="#D6447A" font-weight="700">FROM</tspan><tspan fill="#FFFFFF"> runway_looks</tspan></text>
    <text x="262" y="375"><tspan fill="#D6447A" font-weight="700">WHERE</tspan><tspan fill="#FFFFFF"> season = 'SS27';</tspan></text>
  </g>
  <rect x="262" y="405" width="16" height="34" fill="#D6447A"/>
  <rect x="150" y="520" width="780" height="26" rx="13" fill="#BDBDBD"/>
  <text x="540" y="595" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" fill="#777777">an example question</text>

  <!-- arrow 1 -->
  <line x1="540" y1="628" x2="540" y2="676" stroke="#D6447A" stroke-width="8" stroke-dasharray="14 10" stroke-linecap="round"/>
  <polygon points="516,672 564,672 540,702" fill="#D6447A"/>

  <!-- Step 2: the cloud database -->
  <rect x="60" y="710" width="960" height="560" rx="40" fill="#F7F6F4"/>
  <circle cx="115" cy="772" r="30" fill="#D6447A"/>
  <text x="115" y="786" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="38" font-weight="700" fill="#FFFFFF">2</text>
  <text x="165" y="788" font-family="'DM Serif Display', Georgia, 'DejaVu Serif', serif" font-size="42" fill="#222222">It asks the database in the cloud</text>

  <!-- cloud outline layer -->
  <g fill="#222222" stroke="#222222" stroke-width="12">
    <circle cx="420" cy="1050" r="85"/>
    <circle cx="545" cy="990" r="115"/>
    <circle cx="675" cy="1045" r="90"/>
    <rect x="420" y="1050" width="255" height="85"/>
  </g>
  <!-- cloud fill layer -->
  <g fill="#FFFFFF">
    <circle cx="420" cy="1050" r="85"/>
    <circle cx="545" cy="990" r="115"/>
    <circle cx="675" cy="1045" r="90"/>
    <rect x="420" y="1050" width="255" height="85"/>
  </g>
  <!-- database cylinder -->
  <rect x="483" y="965" width="124" height="115" fill="#111111"/>
  <ellipse cx="545" cy="1080" rx="62" ry="20" fill="#111111"/>
  <ellipse cx="545" cy="965" rx="62" ry="20" fill="#333333"/>
  <path d="M483 1002 A62 20 0 0 0 607 1002" fill="none" stroke="#D6447A" stroke-width="6"/>
  <path d="M483 1040 A62 20 0 0 0 607 1040" fill="none" stroke="#D6447A" stroke-width="6"/>
  <text x="540" y="1232" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" fill="#777777">the data lives here, not on your laptop</text>

  <!-- arrow 2 -->
  <line x1="540" y1="1278" x2="540" y2="1326" stroke="#D6447A" stroke-width="8" stroke-dasharray="14 10" stroke-linecap="round"/>
  <polygon points="516,1322 564,1322 540,1352" fill="#D6447A"/>

  <!-- Step 3: the result -->
  <rect x="60" y="1360" width="960" height="500" rx="40" fill="#F7F6F4"/>
  <circle cx="115" cy="1422" r="30" fill="#D6447A"/>
  <text x="115" y="1436" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="38" font-weight="700" fill="#FFFFFF">3</text>
  <text x="165" y="1438" font-family="'DM Serif Display', Georgia, 'DejaVu Serif', serif" font-size="42" fill="#222222">You get back only what you asked for</text>

  <rect x="180" y="1490" width="720" height="70" rx="18" fill="#111111"/>
  <rect x="180" y="1520" width="720" height="40" fill="#111111"/>
  <g font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="32" fill="#FFFFFF">
    <text x="230" y="1537">brand</text>
    <text x="560" y="1537">colour</text>
  </g>
  <g fill="#FFFFFF" stroke="#DDDDDD" stroke-width="2">
    <rect x="181" y="1561" width="718" height="58"/>
    <rect x="181" y="1619" width="718" height="58"/>
    <rect x="181" y="1677" width="718" height="58" rx="0"/>
  </g>
  <g fill="#D9D9D9">
    <rect x="230" y="1581" width="200" height="18" rx="9"/>
    <rect x="230" y="1639" width="150" height="18" rx="9"/>
    <rect x="230" y="1697" width="180" height="18" rx="9"/>
    <rect x="600" y="1581" width="140" height="18" rx="9"/>
    <rect x="600" y="1639" width="110" height="18" rx="9"/>
    <rect x="600" y="1697" width="160" height="18" rx="9"/>
  </g>
  <circle cx="565" cy="1590" r="13" fill="#D6447A"/>
  <circle cx="565" cy="1648" r="13" fill="#111111"/>
  <circle cx="565" cy="1706" r="13" fill="#BDBDBD"/>
  <text x="540" y="1800" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" fill="#777777">just the columns and rows in your question</text>
</svg>
